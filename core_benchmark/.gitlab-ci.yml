benchmark_core:
  stage: e2e-test
  allow_failure: true
  when: manual
  needs: [ deploy ]
  image: mcr.microsoft.com/playwright:v1.34.3-jammy
  only:
    - develop
  variables:
    USER_NAME: $DEEPPACK_USER_NAME
    PASSWORD:  $DEEPPACK_PASSWORD
  before_script:
    - apt-get clean
    - apt-get update
    - export RELEASE_NAME=$(eval "echo ${CI_COMMIT_REF_SLUG:0:15} | sed 's/-*$//'")
    - export WEB_URL=https://ups.dev.deeppack.ai/$RELEASE_NAME
    - apt-get install -y python3 python3-pip  # Install Python 3 and pip for Python 3
    - export PATH="/usr/bin/python3:$PATH"  # Add Python 3 to PATH
    - cd $CI_PROJECT_DIR/core_benchmark
    - pip install pytest-playwright
    - playwright install
    - pip install -r requirements.txt
    - cd $CI_PROJECT_DIR
    - dvc pull --remote instadeep-s3 packing-data/client_data/ups_sorted_for_inference
    - cd $CI_PROJECT_DIR/core_benchmark/src
    - export API_KEY=$(python3 get_api_key.py | grep 'API Key:' | awk '{print $3}')  # Get Api Key

  script:
    - python3 $CI_PROJECT_DIR/core_benchmark/src/main.py


  artifacts:
    when: always
    paths:
        - core_benchmark/results
